# Event-reactive stage of the transform-request lifecycle (see LIFECYCLE.md).
#
# Fires when an issue enters `stage:test-design` and runs the SAME skill the local
# flow uses (.cursor/skills/design-transform-tests/SKILL.md), headless, via the
# Cursor CLI. The agent posts the test-design comment and advances the issue to
# `stage:test-review` — always INTO review, never past it.
#
# Control layers (mirrors LIFECYCLE.md → Enforcement):
#   1. GITHUB_TOKEN below is scoped to issues:write + contents:read — it cannot
#      push code, approve, or merge, no matter what the agent does.
#   2. A CI-only .cursor/cli.json (written at runtime) denies file writes and
#      allows only read/inspect commands plus gh/git.
#   3. Label changes made with GITHUB_TOKEN do not trigger new workflow runs
#      (GitHub guarantee), so the stage swap cannot loop this workflow.
#
# Requires the CURSOR_API_KEY repository secret (Cursor dashboard → API keys).

name: Test-design agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to run test design on (operator override)
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: test-design-${{ github.event.issue.number || github.event.inputs.issue }}
  cancel-in-progress: false

jobs:
  design-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'stage:test-design' &&
       contains(github.event.issue.labels.*.name, 'type:transform-request'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Restrict agent permissions for CI (read-only tree, gh/git only)
        run: |
          cat > .cursor/cli.json <<'JSON'
          {
            "permissions": {
              "allow": [
                "Read(**)",
                "Shell(gh)",
                "Shell(git)",
                "Shell(ls)",
                "Shell(cat)",
                "Shell(head)",
                "Shell(grep)",
                "Shell(find)"
              ],
              "deny": [
                "Write(**)",
                "Shell(curl)",
                "Shell(wget)",
                "Shell(pip)",
                "Shell(python)",
                "Shell(python3)"
              ]
            }
          }
          JSON

      - name: Run design-transform-tests skill (headless)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue }}
        run: |
          {
            echo "CI mode — you are running headless in GitHub Actions on ${GITHUB_REPOSITORY}."
            echo "Execute the skill below for issue #${ISSUE_NUMBER}."
            echo "gh is already authenticated via GH_TOKEN — never run 'gh auth' commands."
            echo "You are read-only on the working tree: design tests, write no files, open no PR."
            echo "Exactly one stage:* label at a time: when you add stage:test-review, remove ANY other stage:* label the issue carries (stage:test-design, stage:triage, ...)."
            echo "---"
            cat .cursor/skills/design-transform-tests/SKILL.md
          } > "$RUNNER_TEMP/prompt.md"
          AGENT_BIN="$(command -v agent || command -v cursor-agent)"
          "$AGENT_BIN" -p "$(cat "$RUNNER_TEMP/prompt.md")" --force --output-format text
